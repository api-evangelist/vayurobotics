aid: vayurobotics
name: Vayu Robotics
description: Vayu Robotics is a Palo Alto, California robotics company building AI
  foundation models and sensing for autonomous mobile robots. Its stack spans Vayu
  Drive, an end-to-end learned, sim-first foundation model for mobility; Vayu Sense,
  a plenoptic sensor with embodied AI for high-resolution depth perception; a Vayu
  Sense Development Kit bundled with NVIDIA Orin; and Vayu One, a low-cost autonomous
  delivery robot for last- and middle-mile delivery. Backed by Khosla Ventures, the
  company was acquired by Serve Robotics in September 2025. Enrichment probing found
  no public developer API, SDK, developer portal, or event surface.
